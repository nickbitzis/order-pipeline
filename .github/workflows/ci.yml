name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --python 3.12
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
      - name: Chaos run (500 orders, invariants must hold)
        run: uv run python scripts/chaos_demo.py --orders 500 --seed 42

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: orderpipeline:ci
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 orderpipeline:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          curl -sf -X POST localhost:8000/orders -H 'Idempotency-Key: ci-1' \
            -H 'content-type: application/json' \
            -d '{"customer_id":"ci","sku":"SKU-MUG","qty":1}'
          curl -sf localhost:8000/metrics | grep orderpipeline_outbox_pending
          docker rm -f api
      - name: Validate compose file
        run: docker compose config -q
