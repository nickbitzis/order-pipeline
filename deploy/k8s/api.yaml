apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderpipeline-api
  labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: orderpipeline}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: orderpipeline}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: api
          image: ghcr.io/example/orderpipeline:1.0.0
          args: ["api", "--port", "8000"]
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: orderpipeline-config}
          env:
            - {name: ORDERPIPELINE_SERVICE, value: api}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: orderpipeline-data}
---
apiVersion: v1
kind: Service
metadata:
  name: orderpipeline-api
  labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: orderpipeline}
spec:
  selector: {app.kubernetes.io/name: api}
  ports:
    - {name: http, port: 80, targetPort: http}
